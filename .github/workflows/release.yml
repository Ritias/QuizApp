name: Build and publish QuizApp

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Existing release tag to build (for example v1.0.0)'
        required: true
        type: string

permissions:
  contents: write

jobs:
  build-windows:
    name: Build Windows version
    runs-on: windows-2022

    steps:
      - name: Checkout release source
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.tag_name || inputs.tag_name }}

      - name: Set up MSVC
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Set up CMake 4.2
        uses: jwlawson/actions-setup-cmake@v2
        with:
          cmake-version: '4.2.0'

      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.8.3'
          host: windows
          target: desktop
          arch: win64_msvc2022_64
          modules: qtmultimedia

      - name: Configure CMake
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build --parallel

      - name: Locate executable
        id: locate
        shell: pwsh
        run: |
          $exe = Get-ChildItem build -Recurse -File -Filter QuizApp.exe | Select-Object -First 1
          if (-not $exe) { throw "QuizApp.exe was not produced by the build." }
          "exe=$($exe.FullName)" >> $env:GITHUB_OUTPUT
          "exe_dir=$($exe.DirectoryName)" >> $env:GITHUB_OUTPUT

      - name: Deploy Qt dependencies
        shell: pwsh
        run: windeployqt --release --compiler-runtime "${{ steps.locate.outputs.exe }}"

      - name: Package Windows application
        shell: pwsh
        run: |
          Compress-Archive -Path "${{ steps.locate.outputs.exe_dir }}\*" -DestinationPath "$env:GITHUB_WORKSPACE\QuizApp-Windows-x64.zip"

      - name: Upload Windows package
        uses: actions/upload-artifact@v4
        with:
          name: windows-package
          path: QuizApp-Windows-x64.zip

  build-linux:
    name: Build Linux version
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout release source
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.tag_name || inputs.tag_name }}

      - name: Set up CMake 4.2
        uses: jwlawson/actions-setup-cmake@v2
        with:
          cmake-version: '4.2.0'

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential libgl1 libegl1 libxkbcommon0

      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.8.3'
          host: linux
          target: desktop
          arch: linux_gcc_64
          modules: qtmultimedia

      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build --parallel

      - name: Package Linux application
        shell: bash
        run: |
          set -euo pipefail

          exe="$(find build -type f -name QuizApp -perm -111 -print -quit)"
          if [[ -z "$exe" ]]; then
            echo "QuizApp executable was not produced. Build output:"
            find build -maxdepth 6 -type f -print
            exit 1
          fi

          exe_dir="$(dirname "$exe")"
          mkdir -p package
          cp "$exe" package/QuizApp

          if [[ -d "$exe_dir/assets" ]]; then
            cp -r "$exe_dir/assets" package/assets
          else
            cp -r assets package/assets
          fi

          cat > package/run.sh <<'EOF'
          #!/usr/bin/env bash
          set -e
          SCRIPT_DIR="$(cd "$(dirname "${BASH_SOURCE[0]}")" && pwd)"
          cd "$SCRIPT_DIR"
          exec ./QuizApp "$@"
          EOF

          chmod +x package/run.sh package/QuizApp
          tar -czf QuizApp-Linux-x64.tar.gz -C package .

      - name: Upload Linux package
        uses: actions/upload-artifact@v4
        with:
          name: linux-package
          path: QuizApp-Linux-x64.tar.gz

  publish:
    name: Attach files to GitHub Release
    runs-on: ubuntu-latest
    needs: [build-windows, build-linux]

    steps:
      - name: Download packages
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Attach files to release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.release.tag_name || inputs.tag_name }}
          files: dist/*
